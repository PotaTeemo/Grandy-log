<!doctype html>
<html lang="ko">
<head>

  <title>내 차 관리</title>
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="내 차 관리">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

<body>

    <button data-tab="settings"><span class="ti">⚙️</span><span>설정</span></button>
  </nav>

  <div class="sheet-backdrop" id="backdrop" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
  <script type="module" src="sync.js"></script>
